[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#00c805"
backgroundColor = "#0b0e11"
secondaryBackgroundColor = "#151a20"
textColor = "#f4f7f5"
font = "sans serif"

[client]
toolbarMode = "minimal"
