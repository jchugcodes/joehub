name: web stability

# Manual three-pass check for the browser harness. The default tests workflow
# runs npm test once. Run this when a harness change needs the repeated proof.
"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run the web suite three times
        working-directory: web
        run: |
          set -eu
          for attempt in 1 2 3; do
            echo "web suite ${attempt} of 3"
            npm test
          done
